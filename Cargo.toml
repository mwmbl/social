[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/mwmbl/social"
rust-version = "1.90"

# Every dependency is pinned here and used from crates with `workspace = true`.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
zstd = "0.13"
tempfile = "3.27.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }

tinyindex = { path = "crates/tinyindex" }
tokenize = { path = "crates/tokenize" }
social_index = { path = "crates/social_index" }
store = { path = "crates/store" }
apub = { path = "crates/apub" }
fasp = { path = "crates/fasp" }
unicode-segmentation = "1.13.3"
unicode-normalization = "0.1.26"

# Request signing in `apub`. RustCrypto crates move in lockstep (digest 0.11 / rand_core 0.10),
# so these are pinned together to avoid duplicate trait versions.
ed25519-dalek = "3.0.0"
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
sha2 = "0.11.1"
base64 = "0.23.1"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
httpdate = "1.0.3"

# The signed ActivityPub fetch client in `apub`. reqwest is rustls-only (no native-tls/OpenSSL),
# with redirects handled by us so we can refuse cross-host ones. `url` resolves `Location`
# headers and extracts scheme and host; reqwest already depends on it. tokio needs `sync` and
# `time` for the per-host semaphores and the minimum request interval; axum is a dev-dependency
# for the in-process fake ActivityPub host.
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
url = "2.5.8"
tracing = "0.1.44"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }

# The `mwmbl_social` binary. clap (derive + env, for `MWMBL_SOCIAL_CONFIG`) is the CLI; anyhow
# is for error plumbing in the binary only (libraries use thiserror); toml reads the config
# file; tracing-subscriber (env-filter + fmt) turns `tracing` events into stderr logs. tokio
# gains the runtime, macros, signal and net features for the server, the workers and the
# integration tests. reqwest (already pulled in by `apub`) does the one WebFinger lookup that
# `forget <acct>` needs; `apub::fetch` only accepts ActivityPub documents with an `id`.
clap = { version = "4.6.7", features = ["derive", "env"] }
anyhow = "1.0.104"
toml = "1.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# Page packing compresses and serialises a page a dozen times per write; unoptimised
# serde_json makes index tests crawl. Optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.tinyindex]
opt-level = 2
