# DRAFT (audit 2026-11-19, P3). Not active: copy to .github/workflows/ci.yml after replacing
# every <SHA ...> placeholder with the output of audit/ci-draft/resolve-pins.sh.
# Changes from the current ci.yml:
#  - every action pinned by full commit SHA (the tag stays in a trailing comment for Dependabot);
#  - least-privilege `permissions`;
#  - `persist-credentials: false` on checkout, so the token isn't left in .git/config;
#  - a `supply-chain` job running cargo-audit and cargo-deny against deny.toml.
name: CI
on:
  push:
  pull_request:
  schedule:
    # New advisories land without any change here; check daily.
    - cron: "17 5 * * *"
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<SHA for actions/checkout@v4> # v4
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain's `1.100.0` is a branch; pin its SHA and pass the toolchain.
      - uses: dtolnay/rust-toolchain@<SHA for dtolnay/rust-toolchain@1.100.0> # 1.100.0, keep in step with rust-toolchain.toml
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@<SHA for Swatinem/rust-cache@v2> # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<SHA for actions/checkout@v4> # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@<SHA for dtolnay/rust-toolchain@1.100.0> # 1.100.0
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@<SHA for Swatinem/rust-cache@v2> # v2
        with:
          key: supply-chain-tools
          cache-targets: false
          cache-bin: true
      # Installed from crates.io with --locked at exact versions, rather than via a third-party
      # action, so the only code that runs is the tool itself. Bump the versions deliberately.
      - run: cargo install --locked cargo-audit@0.23.0 cargo-deny@<cargo-deny version used by the audit>
      # Fails on any RustSec vulnerability; also warns on unmaintained/yanked.
      - run: cargo audit --deny warnings
      # advisories (vuln, unmaintained, yanked, unsound), bans, sources and licences.
      - run: cargo deny --locked check
